name: Scrape Transport Tenders

# Runs every 6 hours and on manual trigger.
# Fully automated — no CAPTCHA, no human in the loop.
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours UTC → 5:30, 11:30, 17:30, 23:30 IST
  workflow_dispatch:          # also allow manual run from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to commit the CSV back to the repo
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install httpx beautifulsoup4 pandas lxml

      - name: Run widget scraper
        run: |
          # Patch OUTPUT_DIR to a repo-local path for CI
          sed -i 's|OUTPUT_DIR = Path(r"G:.*")|OUTPUT_DIR = Path("./output")|' latest_tenders_widget_scraper.py
          python latest_tenders_widget_scraper.py

      - name: Commit any new CSV files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*.csv || true
          git diff --cached --quiet || git commit -m "Daily tender scrape $(date -u +%Y-%m-%d_%H-%M)"
          git push || true

      - name: Upload CSV as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tender-csv-${{ github.run_id }}
          path: output/*.csv
          if-no-files-found: ignore
          retention-days: 30

      # Optional — email the CSV to yourself. Requires repo secrets:
      #   MAIL_USER (gmail address) and MAIL_PASS (gmail app password).
      # Uncomment this block if you want it.
